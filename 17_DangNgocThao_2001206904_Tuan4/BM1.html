<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title>Bai Mau 1</title>
</head>
<body>
    <form name="F1" method="get" style="border: #666 solid 1px; width: 48%; margin: 0 auto; border-radius:5px;">
        <table style="margin: 0 auto;">
            <tr style="background-color:#cccccc">
                <td colspan="2"><h3 style="margin-left:20px;">THÔNG TIN NGƯỜI GỬI</h3></td>
            </tr>
            <tr>
                <td>* Người gửi </td>
                <td> <input type="text" placeholder="Nhập họ và tên" size="100" style="margin-left:20px; width: 620px; height:50px;"/></td>
            </tr>
            <tr>
                <td>* E-Mail </td>
                <td> <input type="text" placeholder="Nhập Email" size="100" style="margin-left:20px; width: 620px; height:50px;"/></td>
            </tr>
            <tr>
                <td>* Điện thoại </td>
                <td> <input type="text" placeholder="Nhập phone" size="100" style="margin-left:20px; width: 620px; height:50px;"/></td>
            </tr>
        </table>
    </form>
    <br />
    <form name="F2" method="get" style="border: #666 solid 1px; width: 48%; margin: 0 auto; border-radius:5px; ">
         <table style="margin: 0 auto;">
             <tr style="background-color:#cccccc">
                 <td colspan="2"><h3 style="margin-left:20px;">THÔNG TIN NGƯỜI NHẬN</h3></td>
             </tr>
             <tr>
                 <td>* Người nhận </td>
                 <td> <input type="text" placeholder="Nhập họ và tên" size="100" style="margin-left:20px; width: 620px; height:50px;"/></td>
             </tr>
             <tr>
                 <td>* Điện thoại </td>
                 <td> <input type="text" placeholder="Nhập điện thoại" size="100" style="margin-left:20px; width: 620px; height:50px;"/></td>
             </tr>
             <tr>
                 <td>* Địa chỉ </td>
                 <td> <input type="text" placeholder="Nhập dia chi" size="100" style="margin-left:20px; width: 620px; height:50px;"/></td>
             </tr>
             <tr>
                 <td>* Tỉnh/TP </td>
                 <td> <select name="Provine" style="margin-left:20px; width: 620px; height:50px;">
                     <option value="1">TP.HCM nội thành option</option>
                     <option value="2">Hà Nội</option>
                     <option value="3">Huế</option>
                     <option value="4">Đà Nẵng</option>
                     <option value="5">Quảng Ninh</option> 
                     <option value="6">Cần Thơ</option>
                     </select>
                 </td>
             </tr>     
             <tr>
                 <td>* Quận </td>
                 <td> <select name="Provine" style="margin-left:20px; width: 620px; height:50px;">
                     <option value="1">Quận 1</option>
                     <option value="2">Quận 2</option>
                     <option value="3">Quận 3</option>
                     <option value="4">Quận Tân Phú</option>
                     <option value="5">Quận Tân Bình</option> 
                     <option value="6">Quận THủ Đức</option>
                     </select>
                 </td>
             </tr>
        </table> 
        <input type="submit" value="GỬI THÔNG TIN" style="margin-left:310px;height:50px;padding:5px;"/> 
    </form>
</body>
</html>
