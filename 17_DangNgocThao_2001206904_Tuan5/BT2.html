<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Bai Tap 2</title>
</head>
<body>
    <div class="khung" style="width:1340px;">
        <div class="dong1">
            <div class="cot1" style="width:670px; float:left;height:120px;">
                <canvas id="CV1" width="670" height="100"></canvas>
                <script>
                    var c1 = document.getElementById("CV1");
                    var ctx1 = c1.getContext("2d");

                    ctx1.fillStyle = "pink";
                    ctx1.font = "60px Arial";
                    ctx1.fillText("InnerSort.Com", 280, 50);

                    ctx1.moveTo(280, 55);
                    ctx1.lineTo(670, 55);
                    ctx1.strokeStyle = 'blue';
                    ctx1.stroke();

                    ctx1.fillStyle = "green";
                    ctx1.font = "20px Arial";
                    ctx1.fillText("Website bán hàng qua hàng", 410, 75);
                </script>
            </div>
            <div class="cot2" style="width:670px; float:left;height:120px;">
                <canvas id="CV2" width="670" height="100"></canvas>
                <script>
                    var c2 = document.getElementById("CV2");
                    var ctx2 = c2.getContext("2d");

                    ctx2.font = "60px Arial";
                    ctx2.strokeText("Xem-Chọn-Mua", 150, 50);
                    ctx2.fillStyle = "blue";
                    ctx2.font = "20px Arial";
                    ctx2.fillText("Hân hạnh phục các bạn", 100, 95);

                    ctx2.moveTo(0, 100);
                    ctx2.lineTo(670, 100);
                    ctx2.strokeStyle = 'blue';
                    ctx2.stroke();

                    ctx2.beginPath();
                    ctx2.fillStyle = "blue";
                    ctx2.arc(550, 100, 25, Math.PI, 2 * Math.PI);
                    ctx2.fill();
                    ctx2.stroke();

                    ctx2.fillStyle = "blue";
                    ctx2.fillRect(550, 74, 670, 100);
                    ctx2.stroke();
                </script>
            </div>
        </div>
    </div>
</body>
</html>
