<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title>Bai Mau 1</title>
</head>
<body>
    <canvas id="myCanvas" width="200" height="100" style="border:1px solid #000"></canvas>
    <script>
        var c = document.getElementById("myCanvas");
        var ctx = c.getContext("2d");
        ctx.moveTo(0, 0);
        ctx.lineTo(200, 100);
        ctx.stroke();
        ctx.moveTo(0, 100);
        ctx.lineTo(200, 0);
        ctx.stroke();
    </script>
</body>
</html>
